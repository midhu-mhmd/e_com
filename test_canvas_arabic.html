<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Canvas Arabic Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f0f0f0;
    }
    canvas {
      border: 1px solid #333;
      background: #fff;
    }
  </style>
</head>
<body>
  <h2>Canvas Render Test</h2>
  <canvas id="c"></canvas>
  <script>
    window.onload = () => {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const scale = 3; // 3x for high-DPI crispness
      const w = 400;
      const h = 50;
      canvas.width = w * scale;
      canvas.height = h * scale;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';

      ctx.scale(scale, scale);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = '#000000';
      ctx.font = 'bold 16px "Cairo", "Segoe UI", Tahoma, Arial, sans-serif';
      ctx.textBaseline = 'middle';
      
      const text = 'FRESH SEABREAM (2 PCS, 900-1100 G) | سيبريم طازج';
      ctx.fillText(text, 10, h / 2);
    };
  </script>
</body>
</html>
